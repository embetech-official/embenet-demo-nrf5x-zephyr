CONFIG_EMBENET=y

# Both roles in one image, talking over the in-memory queue instead of a UART.
CONFIG_EMBENET_NODE=y
CONFIG_EMBENET_BORDER_ROUTER=y
CONFIG_EMBENET_TRANSPORT_INMEM=y

# Mandatory for the border router - see README.md.
CONFIG_GLIBCXX_LIBCPP=y

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=n
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
# printk output is folded into the log at severity 0, which cannot be filtered out.
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_USE_SEGGER_RTT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_THREAD_NAME=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
