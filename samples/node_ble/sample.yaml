sample:
  name: embeNET Node with Bluetooth LE
  description: Mesh node sharing its radio with a Bluetooth LE peripheral
tests:
  sample.embenet.node_ble:
    tags: embenet
    build_only: true
    platform_allow:
      - nrf52840dk/nrf52840
      - nrf52833dk/nrf52833
      - nrf52dk/nrf52832
      - nrf5340dk/nrf5340/cpunet
      - nrf54l15dk/nrf54l15/cpuapp
