CONFIG_EMBENET=y
CONFIG_EMBENET_NODE=y

# Buttons and LEDs of the blinky service.
CONFIG_GPIO=y

# Log formatting runs on the system workqueue and needs more than the default stack.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_USE_SEGGER_RTT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_THREAD_NAME=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
# main() starts the node and logs its state.
CONFIG_MAIN_STACK_SIZE=2048

# Settings keep K1, PSK and the active switch across resets.
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_RUNTIME=y

# Radio sharing between the node and Bluetooth LE.
CONFIG_MPSL=y
CONFIG_MPSL_TIMESLOT_SESSION_COUNT=1
CONFIG_EMBENET_NODE_MULTIPROTOCOL=y

# Bluetooth LE peripheral with the embeNET Provisioning and Info GATT services - see src/README.md.
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_RX_STACK_SIZE=2048
