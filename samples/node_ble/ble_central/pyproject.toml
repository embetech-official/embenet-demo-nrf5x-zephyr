[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "embenet-ble-central"
version = "0.1.0"
description = "Terminal UI that lists embeNET nodes over Bluetooth LE, reads their GATT services and writes them"
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "bleak>=1.0",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=1.0", "pytest-cov"]
dev = ["embenet-ble-central[test]", "ruff", "mypy"]

# No [project.scripts] entry point: the app is run in place with
# `python ble_central.py`, next to its stylesheet. `pip install .` is the way to
# get the dependencies.
[tool.setuptools]
py-modules = ["ble_central"]
packages = ["central"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
source = ["ble_central", "central"]
branch = true

[tool.coverage.report]
fail_under = 95
exclude_also = ['if __name__ == "__main__":']

[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "ASYNC"]
# The UI's text uses typographic characters (…, ·) on purpose.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["ble_central", "central"]

[tool.mypy]
files = ["ble_central.py", "central"]
strict = true
warn_unreachable = true
