# The network core has no RTC to spare, so the embeNET timer borrows a compare channel of RTC1, the system clock's.
CONFIG_NRF_RTC_TIMER_USER_CHAN_COUNT=1

# On by default for a network core image with logging: it aligns log timestamps with the application core, holding an
# RTC1 channel until the application core answers. The empty application core image never does, so the channel - the
# embeNET timer's - would never be freed.
CONFIG_NRF53_SYNC_RTC=n
