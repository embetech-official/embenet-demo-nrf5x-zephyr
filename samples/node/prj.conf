CONFIG_EMBENET=y
CONFIG_EMBENET_NODE=y

# logger_print() runs here and puts a 256-byte logger_msg_t on the stack before formatting it; the
# 1024-byte default leaves too little headroom once the 128-byte FP stack guard is taken out.
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048

CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
# printk output is folded into the log at severity 0, which cannot be filtered out.
CONFIG_LOG_PRINTK=y
CONFIG_LOG_BUFFER_SIZE=2048

CONFIG_USE_SEGGER_RTT=y
CONFIG_STDOUT_CONSOLE=y
CONFIG_THREAD_NAME=y
CONFIG_PRINTK=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n