enabled: true
readonly: true
language: en
caseSensitive: false

useGitignore: false # ensures better compatibility when used in multiple projects

enabledFileTypes:
 - cpp
 - c
 - markdown
 - cmake
 - json
 - yaml

files: /**
ignorePaths:
 - .clangd
 - .clang-format
 - .cmake-format
 - .cspell.yaml
 - libs/**             # release bundles, not ours to spell-check
 - build/**
 - install/**
 - .cpm-cache/**

ignoreRegExpList:
 - /-W(no)*[a-z]+/g # ignore compiler warning flags
 - /-D[A-Z]+/g # ignore compiler define flags

words:
 # Zephyr and its build system
 - cpuapp
 - devicetree
 - endchoice
 - kconfig
 - menuconfig
 - msgq
 - pinctrl
 - printk
 - subsys
 - workqueue
