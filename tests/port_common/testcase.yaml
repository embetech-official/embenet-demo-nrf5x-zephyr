tests:
  embenet.port_common:
    tags: embenet
    # ports/common links against no prebuilt library, so it runs on the host. The 64-bit variant
    # avoids native_sim's default 32-bit build, which needs gcc-multilib.
    platform_allow:
      - native_sim/native/64
