CONFIG_EMBENET=y
CONFIG_EMBENET_NODE=y

# ------------------------------ LOGGING AND DIAGNOSTICS -------------------------

CONFIG_LOG=y
# Immediate, not deferred: this test prints a handful of lines and then stops, and immediate mode
# guarantees the verdict has actually left the device before main() returns.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n
CONFIG_USE_SEGGER_RTT=y

# Console over the board's UART, which on the DKs is the on-board debugger's VCOM. SEGGER RTT and
# SystemView are deliberately left out - this test should report on the AES port, not on whatever
# the trace transport is doing.
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y
