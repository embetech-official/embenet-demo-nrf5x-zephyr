# No role is selected on purpose. CONFIG_EMBENET alone brings in ports/common, which is where the
# processing semaphore the timer callback gives lives; CONFIG_EMBENET_NODE would additionally pull
# in radio.c, which does not compile for the nRF54L yet. CMake warns about the missing role - that
# warning is expected here.
CONFIG_EMBENET=y

# ------------------------------ LOGGING AND DIAGNOSTICS -------------------------

CONFIG_LOG=y
# Immediate, not deferred: this test prints its verdict and then stops, and immediate mode
# guarantees the last line has left the device before main() returns.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_ASSERT=y
CONFIG_LOG_BACKEND_SHOW_COLOR=n

# Console over the board's UART, which on the DKs is the on-board debugger's VCOM. RTT and
# SystemView are deliberately left out: this test measures interrupt latency, and tracing would be
# measuring itself.
CONFIG_STDOUT_CONSOLE=y
CONFIG_PRINTK=y

# ------------------------------ TIMING -------------------------------------------

# The crystal, not the RC oscillator: the GRTC backend build-asserts on this, and a slot schedule on
# an uncalibrated RC clock drifts out of its slots within the minute.
CONFIG_CLOCK_CONTROL_NRF_K32SRC_XTAL=y
